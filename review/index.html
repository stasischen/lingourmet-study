<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四語對照審閱 · Lingourmet</title><meta name="description" content="日韓泰英表達目的、形式與例句的獨立審閱頁面。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23162343'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='white'%3E四%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,'Noto Sans',sans-serif;color:#182642;background:#f4f6fa;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#152443;color:white;padding:24px max(20px,calc((100vw - 1400px)/2));border-bottom:5px solid #46b6bd}h1{font-size:1.8rem;margin:0 0 6px}header p{margin:0;color:#d3e0ef}main{max-width:1440px;margin:auto;padding:20px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px}.stat{background:white;border:1px solid #dce2eb;border-radius:10px;padding:12px 18px;flex:1;min-width:150px}.stat strong{font-size:1.5rem;display:block}.muted{color:#5c6b80;font-size:.875rem}.notice{border-left:4px solid #e5a435;background:#fff8e8;padding:12px 16px;margin-bottom:20px;font-size:.95rem}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;background:white;border:1px solid #dce2eb;padding:16px;border-radius:10px;position:sticky;top:0;z-index:2}label{display:block;font-size:.9rem;font-weight:600}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #9aa8bb;border-radius:6px;background:white;color:#182642}button{background:white;border:1px solid #a7b4c5;border-radius:6px;padding:8px 14px;color:#182642;cursor:pointer}button:disabled{opacity:.4;cursor:default}.resultbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0;gap:12px;flex-wrap:wrap}.item{background:white;border:1px solid #d9e0eb;border-radius:12px;overflow:hidden;margin:0 0 20px}.item-head{padding:14px 18px;border-bottom:1px solid #dce2eb;background:#edf2f9}.item-head h2{font-size:1.2rem;margin:0}.id{font:12px ui-monospace,monospace;color:#687890;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.lang{padding:16px;border-right:1px solid #e1e6ee;min-width:0}.lang:last-child{border:0}.lang h3{margin:0 0 12px;font-size:1rem;color:#234b75}.entry{padding:12px 0;border-top:1px solid #e5e9f0}.entry:first-of-type{border-top:0;padding-top:0}.form{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}.example{margin:9px 0 2px;font-size:1rem;overflow-wrap:anywhere}.translation{margin:0;color:#475872}.badge{display:inline-block;font-size:.8rem;line-height:1.4;padding:3px 7px;border-radius:4px;margin:6px 5px 0 0;background:#eef2f7;color:#46546a}.ready{background:#e0f2eb;color:#18553d}.warn{background:#fff0cb;color:#794800}details{margin-top:8px;font-size:.875rem}summary{cursor:pointer;color:#4b5970}ul{padding-left:20px;margin:6px 0}.empty{color:#8b5b15;background:#fff8e8;padding:10px;border-radius:6px;font-size:.9rem}.foot{font-size:.875rem;color:#64728a;margin:24px 0}.counter{font-variant-numeric:tabular-nums}.error{background:#fee;padding:20px}a{color:#17628f}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lang:nth-child(2){border-right:0}.lang:nth-child(n+3){border-top:1px solid #e1e6ee}.tools{position:static;grid-template-columns:1fr 1fr}.search{grid-column:1/-1}}@media(max-width:540px){main{padding:12px}.grid{grid-template-columns:1fr}.lang{border-right:0;border-top:1px solid #e1e6ee}.lang:first-child{border-top:0}.tools{grid-template-columns:1fr}.search{grid-column:auto}.stats{gap:8px}.stat{min-width:44%;padding:10px}header{padding:20px 16px}h1{font-size:1.5rem}}
</style></head><body><header><h1>四語對照審閱</h1><p>Lingourmet · 表達目的、形式與例句</p></header><main><div id="stats" class="stats"></div><div class="notice">同一列代表相近的表達目的，不代表四語形式完全等價。這是待審閱的資料快照；重複形式僅標為候選，不會自動合併。條目數不等於獨立文法數。原始 1,054 列含問候等常用表達；文法導覽目前涵蓋其中 980 列。974 種形式也未經語義去重，不能直接當作完成度分母。</div><section class="tools" aria-label="審閱篩選"><label class="search">搜尋中文目的、外語形式、例句或 ID<input id="query" type="search" placeholder="例如：想要、can、你好、條件"></label><label>分類<select id="category"><option value="">全部分類</option></select></label><label>檢查重點<select id="focus"><option value="all">全部條目</option><option value="duplicate">包含重複形式候選</option><option value="missing">包含尚無教學的用法</option><option value="mapping">包含尚未對應的語言</option></select></label></section><div class="resultbar"><div id="count" class="counter" aria-live="polite"></div><div><button id="prev">上一頁</button> <span id="page" class="muted"></span> <button id="next">下一頁</button></div></div><div id="results"></div><p class="foot" id="foot"></p></main><script>
'use strict';let data,rows=[],page=0;const size=12,$=id=>document.getElementById(id);function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function render(){let q=$('query').value.trim().toLocaleLowerCase(),cat=$('category').value,f=$('focus').value;rows=data.rows.filter(r=>(!cat||r.category===cat)&&(!q||[r.title,r.category,r.id,...r.aliases,...Object.values(r.languages).flat().flatMap(u=>[u.id,u.form,u.text,u.translation])].join(' ').toLocaleLowerCase().includes(q))&&(f==='all'||f==='duplicate'&&Object.values(r.languages).flat().some(u=>u.duplicates.length)||f==='missing'&&Object.values(r.languages).flat().some(u=>!u.sections&&!u.shared)||f==='mapping'&&Object.values(r.languages).some(a=>!a.length)));page=Math.max(0,Math.min(page,Math.ceil(rows.length/size)-1));$('count').textContent=`${rows.length} 個表達目的 · 本頁 ${rows.length? page*size+1:0}–${Math.min((page+1)*size,rows.length)}`;$('page').textContent=`${rows.length?page+1:0} / ${Math.ceil(rows.length/size)}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=rows.length;const result=$('results');result.replaceChildren();for(const r of rows.slice(page*size,(page+1)*size)){let art=el('article',undefined,'item'),head=el('div',undefined,'item-head');head.append(el('div',r.category,'muted'),el('h2',r.title),el('div',r.id,'id'));art.append(head);let grid=el('div',undefined,'grid');for(const [lang,name] of Object.entries(data.languages)){let cell=el('section',undefined,'lang');cell.append(el('h3',name));const us=r.languages[lang];if(!us.length)cell.append(el('div',r.mapping[lang]==='not_applicable'?'目前標為不適用，仍需核對':'尚未建立對應用法','empty'));for(const u of us){let block=el('div',undefined,'entry'),form=el('div',u.form,'form');form.lang=lang;block.append(form);block.append(el('span',u.shared?'引用共用教學':u.sections?`解說 ${u.sections} 項`:'尚無教學','badge'+(u.shared||u.sections?' ready':'')));if(u.duplicates.length)block.append(el('span',`形式另見 ${u.duplicates.length} 處`,'badge warn'));let example=el('p',u.text,'example');example.lang=lang;block.append(example,el('p',u.translation||'尚無中文翻譯','translation'));let det=el('details'),sum=el('summary','審閱識別與重複候選');det.append(sum,el('div',u.id,'id'));if(u.duplicates.length){det.append(el('p','相同表面形式可能是同一用法的多重分類，也可能意思不同，需人工核對。'));let list=el('ul');for(const id of u.duplicates)list.append(el('li',id,'id'));det.append(list)}block.append(det);cell.append(block)}grid.append(cell)}art.append(grid);result.append(art)}if(!rows.length)result.append(el('p','沒有符合條件的條目。'))}
fetch('./data.json?v=7e3edce',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('資料載入失敗');return r.json()}).then(d=>{data=d;let total=Object.values(d.counts).reduce((a,b)=>a+b,0);for(const [n,v] of [['原始用法列',total],['表達目的',d.rows.length],['同語言不同形式',d.distinctForms],['重複形式候選群',d.duplicateGroups]]){let s=el('div',undefined,'stat');s.append(el('strong',String(v)),el('span',n));$('stats').append(s)}for(const cat of [...new Set(d.rows.map(r=>r.category))]){let o=el('option',cat);o.value=cat;$('category').append(o)}$('foot').textContent=`資料快照 ${d.date} · ${d.snapshot} · 日語 ${d.counts.ja}／韓語 ${d.counts.ko}／泰語 ${d.counts.th}／英語 ${d.counts.en} 列。解說項目數是資料結構狀態，不代表母語審核通過。本頁獨立於學習網站，不會修改教材。`;render()}).catch(e=>{$('results').append(el('p',e.message,'error'))});for(const id of ['query','category','focus'])$(id).addEventListener(id==='query'?'input':'change',()=>{page=0;render()});$('prev').onclick=()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};</script></body></html>
