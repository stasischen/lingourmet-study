name: Language Core browser smoke
on:
  pull_request:
    paths:
      - 'language-core/**'
      - 'tests/language-core/**'
      - '.github/workflows/language-core-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: language-core-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/language-core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked browser dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium headless shell
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Exercise static candidate in a fresh browser
        run: npm test
      - name: Summarize
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '### Language Core browser smoke\n\nResult: %s\n\nCoverage: two items; three UI and teaching languages; missing French; hidden/revealed answer; return/re-entry; one result per attempt; local persistence and network boundary.\n\nSee step logs for completed checks and failures. Fresh synthetic browser state only. No artifacts, history, screenshots, traces, or account data uploaded.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
