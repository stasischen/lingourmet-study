<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language Core</title><link rel="stylesheet" href="style.css"><body>
<header><span class="wordmark">LINGOURMET <small>LANGUAGE CORE</small></span><span id="private-badge" class="pill"></span></header>
<main><section class="intro"><p id="eyebrow" class="eyebrow"></p><h1 id="intro-title"></h1><p id="intro-description"></p></section>
<section class="toolbar"><label><span id="teaching-label"></span><select id="locale"><option id="teaching-zh-Hant" value="zh-Hant"></option><option id="teaching-ja" value="ja"></option><option id="teaching-en" value="en"></option><option id="teaching-fr" value="fr"></option></select></label><label><span id="ui-label"></span><select id="ui"><option id="ui-zh-Hant" value="zh-Hant"></option><option id="ui-en" value="en"></option><option id="ui-ja" value="ja"></option></select></label><div class="snapshot"><span id="snapshot-label"></span><code id="snapshot"></code></div></section>
<aside id="status" class="notice"></aside><div id="items"></div><section class="history"><h2 id="history-title"></h2><p id="history-count"></p><div id="history"></div></section>
<footer><span id="footer-copy"></span><br><small id="digest"></small></footer></main><script type="module" src="app.mjs"></script></body></html>
