<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingourmet 示範課</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a24;--muted:#66706a;--line:#e3e0d8;--brand:#22594a;--brand-soft:#e3efe9;--ok:#1f7a4a;--ok-soft:#e2f4e9;--bad:#b3392f;--bad-soft:#fbe7e4;--mark:#fff1c2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151a17;--card:#1f2621;--ink:#e8ede9;--muted:#9aa59e;--line:#313a34;--brand:#7cc4a8;--brand-soft:#23362e;--ok:#6fd19b;--ok-soft:#1d3527;--bad:#f08b80;--bad-soft:#3d2421;--mark:#4a4220;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"Noto Sans TC","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;color:var(--brand);margin-right:auto}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
nav{max-width:760px;margin:auto;padding:0 16px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;cursor:pointer}
nav button[aria-current=page]{background:var(--brand);color:var(--bg);border-color:var(--brand);font-weight:700}
main{max-width:760px;margin:auto;padding:16px 16px 80px}
h1{font-size:1.6rem;margin:.2em 0}
h2{font-size:1.15rem;margin:1.6em 0 .5em}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.cando li{margin:2px 0}
.line{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.who{min-width:3.2em;color:var(--muted);font-size:.85rem;padding-top:.35em}
.sent{margin:2px 0}
.ja{font-size:1.25rem;line-height:2.1}
.tok{cursor:pointer;border-radius:4px;padding:0 1px}
.tok:hover,.tok.sel{background:var(--mark)}
.span-kp{border-bottom:2px solid var(--brand)}
.tr{color:var(--muted);font-size:.95rem}
.icon{border:1px solid var(--line);background:var(--card);border-radius:999px;width:2em;height:2em;cursor:pointer;line-height:1;vertical-align:middle}
.icon.on{background:var(--brand-soft)}
.tools{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.toggle{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer}
.pattern{font-size:1.15rem;background:var(--brand-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.kp h3{margin:.1em 0;font-size:1.1rem}
.kp ul{margin:.3em 0;padding-left:1.2em}
.pit{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:4px 0}
.x{color:var(--bad)}.o{color:var(--ok)}
.ex{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline}
#pop{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:9}
#pop .card{box-shadow:0 8px 30px rgba(0,0,0,.18)}
.pop-head{display:flex;align-items:baseline;gap:10px}
.pop-head .ja{font-size:1.5rem}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:10px;padding:8px 12px;margin:8px 0}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:2.8em;padding:6px;border:1px dashed var(--line);border-radius:10px;margin:6px 0}
.tile{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1.1rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.primary{background:var(--brand);color:var(--bg);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
textarea{width:100%;min-height:7em;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand)}
.flash{text-align:center;padding:28px 16px}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding-top:10px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Lingourmet</span>
    <label class="muted" for="loc" id="loc-label"></label>
    <select id="loc"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main" tabindex="-1"></main>
<div id="pop" hidden></div>

: "a", "ja": "レン", "correct": true}, {"id": "b", "ja": "ミナ", "fb": {"zh-Hant": "ミナ 是另一位說話者的名字。", "en": "ミナ is the other speaker’s name."}}, {"id": "c", "ja": "リン", "fb": {"zh-Hant": "發音不同，句中說的是 レン。", "en": "The pronunciation is different; the speaker says レン."}}]}, {"id": "p02", "type": "respond", "kp": "ja:kp:noun-desu", "prompt": {"zh-Hant": "對方說：「はじめまして。リンです。よろしくお願いします。」你的名字是ミナ。請選出同時介紹自己、並回應對方心意的完整說法。", "en": "They say: “はじめまして。リンです。よろしくお願いします。” Your name is Mina. Choose the complete response that introduces you and returns their greeting."}, "options": [{"id": "a", "ja": "はじめまして。ミナです。こちらこそ、よろしくお願いします。", "correct": true, "fb": {"zh-Hant": "這句用「ミナです」介紹自己，再用「こちらこそ、よろしくお願いします」回應對方的心意。自然對話中也可以只回「こちらこそ」；本題還要求介紹自己的名字。", "en": "This introduces you with ミナです and returns the greeting with こちらこそ、よろしくお願いします. In conversation, こちらこそ can also stand on its own; this task additionally asks you to give your name."}}, {"id": "b", "ja": "こちらこそ。", "fb": {"zh-Hant": "「こちらこそ」可以單獨承接對方的心意，不是文法錯誤。不過，本題還要求介紹自己叫ミナ，這個回覆沒有說出自己的名字。", "en": "こちらこそ can stand on its own to return the sentiment; it is not a grammatical error. This task also asks you to introduce yourself as Mina, but this reply does not give your name."}}, {"id": "c", "ja": "はじめまして。ミナさんです。こちらこそ、よろしくお願いします。", "fb": {"zh-Hant": "這句有回應對方的心意，但介紹自己的名字時不加 さん。把「ミナさんです」改成「ミナです」，其餘回應可以保留。", "en": "This returns the other person’s greeting, but do not add さん to your own name. Change ミナさんです to ミナです; the rest of the response can stay."}}]}, {"id": "p03", "type": "choose", "kp": "ja:kp:hajimemashite", "prompt": {"zh-Hant": "在讀書會門口第一次見到新夥伴。剛開口的第一句問候應該說什麼？", "en": "Meeting a new study group partner at the entrance for the first time. What should you say first as an opening greeting?"}, "options": [{"id": "a", "ja": "はじめまして。", "correct": true}, {"id": "b", "ja": "よろしくお願いします。", "fb": {"zh-Hant": "よろしくお願いします 放在自我介紹的結尾，不是剛開口時的第一句問候。", "en": "よろしくお願いします comes at the end of an introduction, not as the opening greeting."}}, {"id": "c", "ja": "こちらこそ、よろしくお願いします。", "fb": {"zh-Hant": "こちらこそ、よろしくお願いします 是在對方先說了請多指教之後的回應。", "en": "こちらこそ、よろしくお願いします is a reply after the other person says よろしくお願いします first."}}]}, {"id": "p04", "type": "find-error", "kp": "ja:kp:noun-desu", "prompt": {"zh-Hant": "初次見面時，想禮貌地介紹自己叫リン，說「はじめまして。リンさんです。」哪裡要修改？", "en": "At a first meeting, you want to introduce yourself politely as Lin. What needs fixing in “はじめまして。リンさんです。”?"}, "options": [{"id": "a", "ja": "リンさん → リン", "correct": true}, {"id": "b", "ja": "はじめまして → よろしくお願いします", "fb": {"zh-Hant": "初次見面開口用 はじめまして 是正確的，よろしくお願いします 放在結尾。", "en": "はじめまして is correct for opening a first meeting; よろしくお願いします comes at the end."}}, {"id": "c", "ja": "リンさんです → リンさん", "fb": {"zh-Hant": "只刪掉 です，仍保留了自稱時不加的 さん。本題要禮貌地介紹自己，保留 です，改成「リンです」。", "en": "Removing です leaves さん attached to your own name. For the polite self-introduction requested here, keep です and say リンです."}}]}, {"id": "p05", "type": "assemble", "kp": "ja:kp:noun-desu", "tiles": ["レン", "です", "さん", "こちらこそ"], "answers": [["レン", "です"]], "prompt": {"zh-Hant": "用日語說：「我是レン。」", "en": "Say in Japanese: “I’m Ren.”"}, "tileFeedback": {"さん": {"zh-Hant": "さん 接在別人的名字後，稱呼自己時不能加。", "en": "さん goes after others’ names; do not add it to your own name."}, "こちらこそ": {"zh-Hant": "こちらこそ 是「我才是」，說自己的名字不需要。", "en": "こちらこそ means “likewise”; not needed when stating your name."}}}, {"id": "p06", "type": "respond", "kp": "ja:kp:yoroshiku", "prompt": {"zh-Hant": "自我介紹時，對方先對你說了「よろしくお願いします。」請選出本題練習的完整回應，表達「我也一樣，請多指教」。", "en": "During introductions, the other person says “よろしくお願いします。” first. Choose the full response practised in this exercise that returns the same sentiment."}, "options": [{"id": "a", "ja": "こちらこそ、よろしくお願いします。", "correct": true, "fb": {"zh-Hant": "「こちらこそ」承接對方的心意，再用「よろしくお願いします」表達「我也一樣，請多指教」。自然對話中，也可以只回「こちらこそ」；這題練習完整說法。", "en": "こちらこそ returns the other person’s sentiment, followed here by よろしくお願いします. In conversation, こちらこそ can also stand on its own; this exercise practises the full response."}}, {"id": "b", "ja": "はじめまして。", "fb   if ('pshow' in d) { r.text = document.getElementById('prod').value; r.checks = runChecks(it, r.text); r.shown = true; return render('[data-pself]'); }
  if ('pself' in d) { r.ok = r.ok ?? d.pself === '1'; r.done = true; return render('[data-pnext]'); }
  if ('pnext' in d) { P.i++; window.scrollTo(0, 0); return render('.opt, [data-build], #prod, [data-prestart]'); }
  if (d.flip) { S.flip = d.flip; return render('[data-grade]'); }
  if (d.grade) { gradeCard(+d.grade); return render('[data-flip]'); }
});
document.addEventListener('input', e => { if (e.target.id === 'prod') { const P = S.prac, order = P.queue || items.map(x => x.id); (P.res[order[P.i]] ||= {}).text = e.target.value; save(); updateStorageNotice(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closePop(true);
  const token = e.target?.closest?.('.tok');
  // Native vocabulary buttons already synthesize click on Enter/Space.
  if (token && token.tagName !== 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); openPop(token);
  }
});
window.addEventListener?.('hashchange', () => closePop());
render();
</script>
