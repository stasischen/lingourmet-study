<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingourmet 示範課</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a24;--muted:#66706a;--line:#e3e0d8;--brand:#22594a;--brand-soft:#e3efe9;--ok:#1f7a4a;--ok-soft:#e2f4e9;--bad:#b3392f;--bad-soft:#fbe7e4;--mark:#fff1c2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151a17;--card:#1f2621;--ink:#e8ede9;--muted:#9aa59e;--line:#313a34;--brand:#7cc4a8;--brand-soft:#23362e;--ok:#6fd19b;--ok-soft:#1d3527;--bad:#f08b80;--bad-soft:#3d2421;--mark:#4a4220;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"Noto Sans TC","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;color:var(--brand);margin-right:auto}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
nav{max-width:760px;margin:auto;padding:0 16px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;cursor:pointer}
nav button[aria-current=page]{background:var(--brand);color:var(--bg);border-color:var(--brand);font-weight:700}
main{max-width:760px;margin:auto;padding:16px 16px 80px}
h1{font-size:1.6rem;margin:.2em 0}
h2{font-size:1.15rem;margin:1.6em 0 .5em}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.cando li{margin:2px 0}
.line{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.who{min-width:3.2em;color:var(--muted);font-size:.85rem;padding-top:.35em}
.sent{margin:2px 0}
.ja{font-size:1.25rem;line-height:2.1}
.tok{cursor:pointer;border-radius:4px;padding:0 1px}
.tok:hover,.tok.sel{background:var(--mark)}
.span-kp{border-bottom:2px solid var(--brand)}
.tr{color:var(--muted);font-size:.95rem}
.icon{border:1px solid var(--line);background:var(--card);border-radius:999px;width:2em;height:2em;cursor:pointer;line-height:1;vertical-align:middle}
.icon.on{background:var(--brand-soft)}
.tools{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.toggle{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer}
.pattern{font-size:1.15rem;background:var(--brand-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.kp h3{margin:.1em 0;font-size:1.1rem}
.kp ul{margin:.3em 0;padding-left:1.2em}
.pit{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:4px 0}
.x{color:var(--bad)}.o{color:var(--ok)}
.ex{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline}
#pop{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:9}
#pop .card{box-shadow:0 8px 30px rgba(0,0,0,.18)}
.pop-head{display:flex;align-items:baseline;gap:10px}
.pop-head .ja{font-size:1.5rem}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:10px;padding:8px 12px;margin:8px 0}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:2.8em;padding:6px;border:1px dashed var(--line);border-radius:10px;margin:6px 0}
.tile{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1.1rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.primary{background:var(--brand);color:var(--bg);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
textarea{width:100%;min-height:7em;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand)}
.flash{text-align:center;padding:28px 16px}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding-top:10px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Lingourmet</span>
    <label class="muted" for="loc" id="loc-label"></label>
    <select id="loc"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main" tabindex="-1"></main>
<div id="pop" hidden></div>
<script id="package" type="application/json">{"packageId": "ja:l01-3", "targetLanguage": "ja", "teachingLocales": ["zh-Hant", "en"], "preview": {"channel": "ja-u01", "vocabularySenseRefs": ["ja:読書会#1", "ja:へ#1", "ja:ようこそ#1", "ja:こんにちは#1", "ja:おはようございます#1", "ja:こんばんは#1", "ja:さようなら#1", "ja:おやすみなさい#1"], "revision": "6b82539c61562a377f05725398c3901c659e56aaa46cbba5e655b2cab21f012c", "migration": {"fromRevision": "52a1b5f61c8d1f1ac18a3dea24303a804115983ac1ae58fda2a0dc47c37bfc9c", "compatiblePracticeIds": ["p01", "p02", "p03", "p04", "p12"]}}, "lesson": {"title": {"zh-Hant": "讀書會自我介紹", "en": "Self-Introductions at the Book Club"}, "scene": {"zh-Hant": "讀書會開始。主持人田中先向大家打招呼、說出名字，接著レン和ミナ依序向全體介紹自己。", "en": "The book club begins. The host, Ms. Tanaka, greets the group and gives her name. Ren and Mina then take turns introducing themselves to everyone."}, "canDo": {"zh-Hant": ["能聽懂讀書會的歡迎標語「読書会へようこそ」", "能掌握助詞「は」讀作 wa、「へ」讀作 e 的發音規則", "能整合名字、身分與來處，向大家進行一段完整的自我介紹"], "en": ["Understand the book club welcome sign 読書会へようこそ", "Read the particles は as wa and へ as e correctly", "Give a complete self-introduction combining your name, role or occupation, and where you are from"]}, "speakers": {"tanaka": {"name": "田中さん"}, "ren": {"name": "レン"}, "mina": {"name": "ミナ"}}, "sources": [{"id": "welcome-board", "title": {"zh-Hant": "讀書會歡迎牌", "en": "Book club welcome sign"}, "lines": [{"sentences": ["ja:l01-3:s01"]}]}, {"id": "dialogue", "title": {"zh-Hant": "全體自我介紹", "en": "Group self-introductions"}, "lines": [{"speaker": "tanaka", "sentences": ["ja:l01-3:s02", "ja:l01-3:s03"]}, {"speaker": "ren", "sentences": ["ja:l01-3:s05", "ja:l01-3:s06", "ja:l01-3:s07", "ja:l01-3:s08", "ja:l01-3:s09"]}, {"speaker": "mina", "sentences": ["ja:l01-3:s10", "ja:l01-3:s11", "ja:l01-3:s12"]}]}], "teaching": [{"group": {"zh-Hant": "發音規則", "en": "Pronunciation rule"}, "kps": ["ja:kp:particle-reading"]}, {"group": {"zh-Hant": "日常問候", "en": "Everyday greetings"}, "kps": ["ja:kp:everyday-greetings"]}], "practice": [{"id": "p01", "type": "listen-choose", "kp": "ja:kp:particle-reading", "audioRefs": ["ja:l01-3:s01"], "prompt": {"zh-Hant": "聽句子，意思是？", "en": "Listen. What does it mean?"}, "options": [{"id": "a", "correct": true, "text": {"zh-Hant": "歡迎來到讀書會。", "en": "Welcome to the book club."}}, {"id": "b", "text": {"zh-Hant": "我要去讀書會。", "en": "I’m going to the book club."}, "fb": {"zh-Hant": "へ 標示方向，但 ようこそ 是「歡迎」，不是「去」。", "en": "へ marks direction, but ようこそ means “welcome,” not “going to.”"}}, {"id": "c", "text": {"zh-Hant": "這裡是讀書會。", "en": "This place is the book club."}, "fb": {"zh-Hant": "句子中沒有「這裡」的意思；ようこそ 是「歡迎」。", "en": "The sentence does not say “this place”; ようこそ means “welcome.”"}}]}, {"id": "p02", "type": "choose", "kp": "ja:kp:particle-reading", "prompt": {"zh-Hant": "「田中さんは？」中的「は」讀音是什麼？", "en": "How is は pronounced in 田中さんは？"}, "options": [{"id": "a", "ja": "wa", "correct": true}, {"id": "b", "ja": "ha", "fb": {"zh-Hant": "當助詞標示話題時，は 讀作 wa。", "en": "As a topic particle, は is pronounced wa."}}, {"id": "c", "ja": "e", "fb": {"zh-Hant": "讀作 e 的是助詞 へ。", "en": "e is the pronunciation for the particle へ."}}]}, {"id": "p03", "type": "choose", "kp": "ja:kp:particle-reading", "prompt": {"zh-Hant": "「読書会へようこそ」中的「へ」讀音是什麼？", "en": "How is へ pronounced in 読書会へようこそ？"}, "options": [{"id": "a", "ja": "e", "correct": true}, {"id": "b", "ja": "he", "fb": {"zh-Hant": "當助詞標示方向時，へ 讀作 e。", "en": "As a direction particle, へ is pronounced e."}}, {"id": "c", "ja": "wa", "fb": {"zh-Hant": "讀作 wa 的是話題助詞 は。", "en": "wa is the pronunciation for the topic particle は."}}]}, {"id": "p04", "type": "choose", "kp": "ja:kp:particle-reading", "prompt": {"zh-Hant": "「はじめまして」中的「は」讀音是什麼？", "en": "How is the は in はじめまして pronounced?"}, "options": [{"id": "a", "ja": "ha", "correct": true}, {"id": "b", "ja": "wa", "fb": {"zh-Hant": "は 只有在當助詞（或源自助詞的特定問候語字尾）時才讀 wa；「はじめまして」中的 は 是一般單字的一部分，保持原本的假名發音。", "en": "は is pronounced wa only when used as a particle (or in greetings derived from particles); in はじめまして it keeps its standard kana sound."}}, {"id": "c", "ja": "e", "fb": {"zh-Hant": "讀作 e 的是助詞 へ。", "en": "e is the pronunciation for the particle へ."}}]}, {"id": "p05", "type": "choose", "kp": "ja:kp:everyday-greetings", "prompt": {"zh-Hant": "睡前向家人道晚安，應該說哪一句？", "en": "What do you say to your family before going to bed?"}, "options": [{"id": "a", "ja": "おやすみなさい。", "correct": true, "fb": {"zh-Hant": "「おやすみなさい」是睡前的「晚安」。", "en": "おやすみなさい means “good night” and fits saying goodnight before bed."}}, {"id": "b", "ja": "こんばんは。", "fb": {"zh-Hant": "「こんばんは」是晚上見面的問候（注意字尾「は」源自助詞讀作 wa），就寢前要說「おやすみなさい」。", "en": "こんばんは is for greeting someone in the evening (the ending は is from the particle and pronounced wa); say おやすみなさい before going to sleep."}}, {"id": "c", "ja": "さようなら。", "fb": {"zh-Hant": "「さようなら」是道別語；本題是睡前向家人道晚安，用「おやすみなさい」。", "en": "さようなら is a farewell. Here you are saying goodnight before bed, so use おやすみなさい."}}]}, {"id": "p06", "type": "choose", "kp": "ja:kp:everyday-greetings", "prompt": {"zh-Hant": "早晨見面時，禮貌打招呼說哪一句？", "en": "Which greeting is used politely when meeting in the morning?"}, "options": [{"id": "a", "ja": "おはようございます。", "correct": true, "fb": {"zh-Hant": "「おはようございます」是早晨見面時禮貌的「早安」。", "en": "おはようございます is a polite “good morning”."}}, {"id": "b", "ja": "こんばんは。", "fb": {"zh-Hant": "「こんばんは」是晚上見面的問候（注意字尾「は」讀作 wa）。", "en": "こんばんは is an evening greeting (note that the ending は is pronounced wa)."}}, {"id": "c", "ja": "さようなら。", "fb": {"zh-Hant": "「さようなら」是道別說的「再見」。", "en": "さようなら means “goodbye.”"}}]}, {"id": "p07", "type": "choose", "kp": "ja:kp:everyday-greetings", "prompt": {"zh-Hant": "晚上見面打招呼時應該說哪一句？", "en": "Which greeting should you say when meeting in the evening?"}, "options": [{"id": "a", "ja": "こんばんは。", "correct": true, "fb": {"zh-Hant": "「こんばんは」是晚上見面時的問候，讀作「こんばんわ」。", "en": "こんばんは means “good evening” and is read こんばんわ."}}, {"id": "b", "ja": "おはようございます。", "fb": {"zh-Hant": "「おはようございます」是早上的問候，沒有包含讀作 wa 的「は」。", "en": "おはようございます is a morning greeting and does not contain は pronounced wa."}}, {"id": "c", "ja": "おやすみなさい。", "fb": {"zh-Hant": "「おやすみなさい」是睡前道別說的「晚安」，不是晚上見面打招呼。", "en": "おやすみなさい is said before bed, not when greeting someone in the evening."}}]}, {"id": "p08", "type": "choose", "kp": "ja:kp:everyday-greetings", "prompt": {"zh-Hant": "學生放學時向老師道別，以下哪一句適合？", "en": "A student is saying goodbye to a teacher after school. Which of these phrases fits?"}, "options": [{"id": "a", "ja": "さようなら。", "correct": true, "fb": {"zh-Hant": "「さようなら」是「再見」，適合這裡學生向老師道別的情境；不表示熟人每次聚會離開都要用它。", "en": "さようなら means “goodbye” and fits this student–teacher farewell. It is not the default for every departure from a gathering of familiar adults."}}, {"id": "b", "ja": "こんにちは。", "fb": {"zh-Hant": "「こんにちは」是白天見面的問候（尾端的「は」讀作 wa），不是離別道別。", "en": "こんにちは is a daytime greeting (the ending は is pronounced wa), not a farewell."}}, {"id": "c", "ja": "はじめまして。", "fb": {"zh-Hant": "「はじめまして」只能用在初次見面的開場（注意這裡的「は」維持一般發音，不讀 wa）。", "en": "はじめまして is only for the opening of a first meeting (note that this は keeps its regular sound, not wa)."}}]}, {"id": "p09", "type": "choose", "kp": "ja:kp:hajimemashite", "prompt": {"zh-Hant": "下週白天再次在讀書會遇到ミナ時，第一句應該說什麼？", "en": "When you meet Mina again at the book club during the day next week, what should you say first?"}, "options": [{"id": "a", "ja": "こんにちは。", "correct": true}, {"id": "b", "ja": "はじめまして。", "fb": {"zh-Hant": "はじめまして 只能在第一次見面時使用，之後見面改用 こんにちは 等日常問候。", "en": "はじめまして is only for the very first meeting; use こんにちは or other everyday greetings afterwards."}}, {"id": "c", "ja": "こちらこそ。", "fb": {"zh-Hant": "こちらこそ 是在對方表達禮貌後的客氣回應，不能當作見面第一句。", "en": "こちらこそ is a reply after someone else speaks politely, not an opening greeting."}}]}, {"id": "p10", "type": "cloze", "kp": "ja:kp:topic-return", "prompt": {"zh-Hant": "空格填入哪一個詞，意思是「レン你呢？」？", "en": "Which word fills the blank to ask “And you, Ren?”"}, "context": [{"speaker": "mina", "ja": "学生です。レンさん＿？"}], "options": [{"id": "a", "ja": "は", "correct": true}, {"id": "b", "ja": "から", "fb": {"zh-Hant": "から 是「從」，接在地方名詞後面。", "en": "から means “from” after a place noun."}}, {"id": "c", "ja": "です", "fb": {"zh-Hant": "接 です 會變成「是レン先生」，不是反問對方的問句。", "en": "Adding です makes it “is Ren,” not a question back to the other person."}}]}, {"id": "p11", "type": "listen-choose", "kp": "ja:kp:kara-kimashita", "audioRefs": ["ja:l01-3:s07"], "prompt": {"zh-Hant": "聽句子，意思是？", "en": "Listen. What does it mean?"}, "options": [{"id": "a", "correct": true, "text": {"zh-Hant": "我來自台灣。", "en": "I’m from Taiwan."}}, {"id": "b", "text": {"zh-Hant": "我要去台灣。", "en": "I’m going to Taiwan."}, "fb": {"zh-Hant": "から 是「從」，来ました 是「來了」，不是「去」。", "en": "から means “from” and 来ました means “came,” not “going to.”"}}, {"id": "c", "text": {"zh-Hant": "我在台灣工作。", "en": "I work in Taiwan."}, "fb": {"zh-Hant": "這句話只說明從哪裡來，沒有提到工作。", "en": "This sentence only states where you are from, not your job."}}]}, {"id": "p12", "type": "respond", "kp": "ja:kp:yoroshiku", "prompt": {"zh-Hant": "レン說了「よろしくお願いします。」請選出本題練習的完整回應，表達「我也一樣，請多指教」。", "en": "Ren says “よろしくお願いします。” Choose the full response practised in this exercise that returns the same sentiment."}, "context": [{"speaker": "ren", "ja": "よろしくお願いします。"}], "options": [{"id": "a", "ja": "こちらこそ、よろしくお願いします。", "correct": true, "fb": {"zh-Hant": "用「こちらこそ、よろしくお願いします」承接レン的心意。自然對話中，也可以只回「こちらこそ」；本題複習的是完整說法。", "en": "こちらこそ、よろしくお願いします returns Ren’s sentiment. In conversation, こちらこそ can also stand on its own; this review exercise practises the full response."}}, {"id": "b", "ja": "ミナです。", "fb": {"zh-Hant": "「ミナです」是在介紹自己的名字。本題要承接對方「請多指教」的心意，請選出表達這份心意的完整回應。", "en": "ミナです introduces your name as Mina. This task asks for the full response that returns the sentiment of よろしくお願いします."}}, {"id": "c", "ja": "はじめまして。", "fb": {"zh-Hant": "「はじめまして」是初次見面的問候。本題要回應レン剛才「請多指教」的心意，因此練習「こちらこそ、よろしくお願いします」，不是再次選開場問候。", "en": "はじめまして is a greeting for a first meeting. This task practises returning the sentiment Ren has just expressed, using こちらこそ、よろしくお願いします, rather than choosing the opening greeting."}}]}, {"id": "p13", "type": "assemble", "kp": "ja:kp:noun-desu", "tiles": ["エンジニア", "です", "さん", "は"], "answers": [["エンジニア", "です"]], "prompt": {"zh-Hant": "用字塊組成日語句子：「我是工程師。」", "en": "Build the Japanese sentence: “I am an engineer.”"}, "tileFeedback": {"さん": {"zh-Hant": "さん 只能接在別人的名字後面，自己的身分或職業不能加 さん。", "en": "さん is only for other people’s names; never add it to your own occupation."}, "は": {"zh-Hant": "は 標示話題，不是身分名詞和 です 之間的連接詞；「エンジニアはです」沒有說出關於這個話題的內容。本題直接用「エンジニアです」說自己的職業。", "en": "は marks a topic; it does not join an occupation noun to です. エンジニアはです does not say anything about the topic. Here, エンジニアです directly states your occupation."}}}, {"id": "p14", "type": "order-lines", "kp": "ja:kp:yoroshiku", "lines": ["よろしくお願いします。", "学生です。", "はじめまして。", "リンです。"], "rules": {"first": "はじめまして。", "last": "よろしくお願いします。", "before": [["リンです。", "学生です。"]]}, "prompt": {"zh-Hant": "把自我介紹排成自然的順序。", "en": "Put the self-introduction in a natural order."}, "fb": {"zh-Hant": "はじめまして 開頭、よろしくお願いします 結尾，名字先於身分。", "en": "Start with はじめまして, end with よろしくお願いします, and give your name before your role or occupation."}}, {"id": "p15", "type": "produce", "kp": "ja:kp:noun-desu", "models": ["ja:x:l01-3-03", "ja:x:l01-3-04"], "prompt": {"zh-Hant": "用你自己的資料寫一段自我介紹（3～5 句）。不想寫真名可以用暱稱。", "en": "Write a 3–5 sentence self-introduction about yourself. A nickname is fine."}, "frame": {"zh-Hant": "はじめまして。〔名字〕です。〔身分〕です。〔地方〕から来ました。よろしくお願いします。", "en": "はじめまして。〔name〕です。〔role / occupation〕です。〔place〕から来ました。よろしくお願いします。"}, "checks": [{"id": "open", "type": "startsWith", "value": "はじめまして", "label": {"zh-Hant": "用 はじめまして 開頭", "en": "Starts with はじめまして"}}, {"id": "desu", "type": "contains", "value": "です", "label": {"zh-Hant": "用 です 說出名字或身分", "en": "Uses です for your name, role or occupation"}}, {"id": "close", "type": "endsWithAny", "value": ["よろしくお願いします。", "よろしくお願いします", "よろしくおねがいします。", "よろしくおねがいします"], "label": {"zh-Hant": "用 よろしくお願いします 結尾", "en": "Ends with よろしくお願いします"}}, {"id": "nosan", "type": "notMatches", "value": "^はじめまして。?[^。]*さんです", "label": {"zh-Hant": "自己的名字沒有加 さん", "en": "No さん after your own name"}}]}]}, "lexicon": {"ja:name": {"lemma": "（人名）", "pos": "name", "senses": {"1": {"gloss": {"zh-Hant": "人名", "en": "personal name"}}}}, "ja:おはようございます": {"lemma": "おはようございます", "pos": "expression", "senses": {"1": {"gloss": {"zh-Hant": "早安", "en": "good morning"}}}, "tier": "extended"}, "ja:おやすみなさい": {"lemma": "おやすみなさい", "pos": "expression", "senses": {"1": {"gloss": {"zh-Hant": "晚安", "en": "good night"}}}, "tier": "extended"}, "ja:お願いします": {"lemma": "お願いする", "reading": "おねがいする", "pos": "verb", "senses": {"1": {"kp": "ja:kp:yoroshiku", "gloss": {"zh-Hant": "拜託、麻煩您", "en": "please (polite request)"}}}}, "ja:から": {"lemma": "から", "pos": "particle", "senses": {"from": {"kp": "ja:kp:kara-kimashita", "gloss": {"zh-Hant": "從", "en": "from"}}}}, "ja:こちらこそ": {"lemma": "こちらこそ", "pos": "expression", "senses": {"1": {"kp": "ja:kp:yoroshiku", "gloss": {"zh-Hant": "我才是、彼此彼此", "en": "likewise; the pleasure is mine"}}}}, "ja:こんにちは": {"lemma": "こんにちは", "reading": "こんにちわ", "pos": "expression", "senses": {"1": {"gloss": {"zh-Hant": "你好", "en": "hello"}, "note": {"zh-Hant": "字尾的「は」源自話題助詞，因此讀作 wa。", "en": "The ending は originated as a topic particle, so it is pronounced wa."}}}, "tier": "extended"}, "ja:こんばんは": {"lemma": "こんばんは", "reading": "こんばんわ", "pos": "expression", "senses": {"1": {"gloss": {"zh-Hant": "晚上好", "en": "good evening"}, "note": {"zh-Hant": "字尾的「は」源自話題助詞，因此讀作 wa。", "en": "The ending は originated as a topic particle, so it is pronounced wa."}}}, "tier": "extended"}, "ja:さようなら": {"lemma": "さようなら", "pos": "expression", "senses": {"1": {"gloss": {"zh-Hant": "再見", "en": "goodbye"}}}, "tier": "extended"}, "ja:さん": {"lemma": "さん", "pos": "suffix", "senses": {"1": {"gloss": {"zh-Hant": "先生／小姐（接在別人名字後）", "en": "Mr./Ms. (after someone else's name)"}, "note": {"zh-Hant": "不能接在自己的名字後。", "en": "Never used after your own name."}}}}, "ja:です": {"lemma": "です", "pos": "auxiliary", "senses": {"1": {"kp": "ja:kp:noun-desu", "gloss": {"zh-Hant": "是（禮貌句尾）", "en": "am / is (polite)"}}}}, "ja:は": {"lemma": "は", "reading": "わ", "pos": "particle", "senses": {"topic": {"kp": "ja:kp:topic-return", "gloss": {"zh-Hant": "標示話題（說到…）", "en": "topic marker (as for …)"}, "note": {"zh-Hant": "當助詞時讀作 wa。", "en": "Read as wa when used as a particle."}}}}, "ja:はじめまして": {"lemma": "はじめまして", "pos": "expression", "senses": {"1": {"kp": "ja:kp:hajimemashite", "gloss": {"zh-Hant": "初次見面", "en": "nice to meet you (first meeting)"}}}}, "ja:へ": {"lemma": "へ", "reading": "え", "pos": "particle", "senses": {"1": {"kp": "ja:kp:particle-reading", "gloss": {"zh-Hant": "往、到（方向）", "en": "to, toward"}, "note": {"zh-Hant": "當助詞時讀作 e。", "en": "Read as e when used as a particle."}}}, "tier": "core"}, "ja:ようこそ": {"lemma": "ようこそ", "pos": "interjection", "senses": {"1": {"gloss": {"zh-Hant": "歡迎", "en": "welcome"}, "note": {"zh-Hant": "主人迎接來客時說，客人不說。", "en": "Said by the host to guests, not by guests."}}}, "tier": "core"}, "ja:よろしく": {"lemma": "よろしく", "pos": "adverb", "senses": {"1": {"kp": "ja:kp:yoroshiku", "gloss": {"zh-Hant": "多多指教（固定說法的一部分）", "en": "kindly (part of a set phrase)"}}}}, "ja:アメリカ": {"lemma": "アメリカ", "pos": "proper_noun", "senses": {"1": {"gloss": {"zh-Hant": "美國", "en": "the US"}}}}, "ja:エンジニア": {"lemma": "エンジニア", "pos": "noun", "senses": {"1": {"gloss": {"zh-Hant": "工程師", "en": "engineer"}}}}, "ja:京都": {"lemma": "京都", "reading": "きょうと", "pos": "proper_noun", "senses": {"1": {"gloss": {"zh-Hant": "京都", "en": "Kyoto"}}}}, "ja:会社員": {"lemma": "会社員", "reading": "かいしゃいん", "pos": "noun", "senses": {"1": {"gloss": {"zh-Hant": "上班族、公司職員", "en": "office worker"}}}}, "ja:台湾": {"lemma": "台湾", "reading": "たいわん", "pos": "proper_noun", "senses": {"1": {"gloss": {"zh-Hant": "台灣", "en": "Taiwan"}}}}, "ja:大阪": {"lemma": "大阪", "reading": "おおさか", "pos": "proper_noun", "senses": {"1": {"gloss": {"zh-Hant": "大阪", "en": "Osaka"}}}}, "ja:学生": {"lemma": "学生", "reading": "がくせい", "pos": "noun", "senses": {"1": {"gloss": {"zh-Hant": "學生", "en": "student"}}}}, "ja:来る": {"lemma": "来る", "reading": "くる", "pos": "verb", "senses": {"1": {"gloss": {"zh-Hant": "來", "en": "to come"}}}}, "ja:東京": {"lemma": "東京", "reading": "とうきょう", "pos": "proper_noun", "senses": {"1": {"gloss": {"zh-Hant": "東京", "en": "Tokyo"}}}}, "ja:読書会": {"lemma": "読書会", "reading": "どくしょかい", "pos": "noun", "senses": {"1": {"gloss": {"zh-Hant": "讀書會", "en": "book club"}}}, "tier": "core"}}, "knowledge": {"ja:kp:everyday-greetings": {"kind": "expression", "exampleRefs": ["ja:l01-3:s02", "ja:x:l01-3-05", "ja:x:l01-3-06", "ja:x:l01-3-07", "ja:x:l01-3-08"], "title": {"zh-Hant": "依場合打招呼與道別", "en": "Greetings for different situations"}, "pattern": {"zh-Hant": "おはようございます。／こんにちは。／こんばんは。／おやすみなさい。／さようなら。", "en": "おはようございます。 / こんにちは。 / こんばんは。 / おやすみなさい。 / さようなら。"}, "meaning": {"zh-Hant": "依見面的時間或道別的場合，選擇不同問候。", "en": "Choose a greeting for the time of day or the kind of farewell."}, "points": {"zh-Hant": ["早晨見面用「おはようございます」（早安）；白天見面用「こんにちは」（你好）；晚上見面用「こんばんは」（晚上好）。こんにちは、こんばんは 尾端的 は 都讀 wa。", "睡前向人道晚安用「おやすみなさい」，不是晚上剛見面的問候。", "「さようなら」是道別語，例如學生放學向老師道別。它不是熟人每次離開時都最自然的說法。"], "en": ["Use おはようございます (“good morning”) when meeting in the morning, こんにちは (“hello”) during the day, and こんばんは (“good evening”) in the evening. The final は in こんにちは and こんばんは is pronounced wa.", "Say おやすみなさい (“good night”) before going to bed, rather than when first greeting someone in the evening.", "さようなら means “goodbye”; one setting is a student saying goodbye to a teacher after school. It is not the default for every everyday departure among familiar adults."]}}, "ja:kp:hajimemashite": {"kind": "expression", "exampleRefs": ["ja:l01-1:s01", "ja:x:l01-1-01", "ja:x:l01-1-04"], "title": {"zh-Hant": "初次見面：はじめまして", "en": "First meeting: はじめまして"}, "pattern": {"zh-Hant": "はじめまして。〔名字〕です。", "en": "はじめまして。〔name〕です。"}, "meaning": {"zh-Hant": "第一次見到某人時的開場白。", "en": "What you say when you meet someone for the first time."}, "points": {"zh-Hant": ["只用在第一次見面。之後再遇到同一個人就不再使用。", "說完通常馬上接著說出自己的名字。"], "en": ["Only used for the very first meeting. It is not used when you see the same person again.", "You usually follow it immediately with your name."]}}, "ja:kp:kara-kimashita": {"kind": "grammar", "exampleRefs": ["ja:l01-2:s04", "ja:l01-2:s05", "ja:x:l01-2-03", "ja:x:l01-2-04"], "title": {"zh-Hant": "我來自…：〔地方〕から来ました", "en": "I’m from …: 〔place〕から来ました"}, "pattern": {"zh-Hant": "〔國家／城市〕から来ました。", "en": "〔country / city〕から来ました。"}, "meaning": {"zh-Hant": "說自己從哪裡來。", "en": "Says where you come from."}, "points": {"zh-Hant": ["から 是「從」；来ました 是「來了」（来る 的禮貌過去式）。", "日語用過去式「来ました」（我是從…來的），中文自然說「我來自…」。", "把前面〔國家／城市〕換成自己來自的地方（如「台湾」、「大阪」），後面接「から来ました」，就能介紹自己來自哪裡。"], "en": ["から = from; 来ました = came (polite past of 来る).", "Japanese uses the past tense (“I came from …”); in English, “I’m from …” sounds natural.", "Replace 〔country / city〕 with where you are from (such as 台湾 or 大阪) and keep から来ました to say where you come from."]}, "pitfalls": [{"wrong": "台湾に来ました。", "right": "台湾から来ました。", "why": {"zh-Hant": "に 標示目的地「到」，台湾に来ました 是「我來到台灣」；要說從哪裡來，用「から」。", "en": "に marks a destination: 台湾に来ました means “I came to Taiwan”; use から to state where you are from."}, "context": {"zh-Hant": "想表達自己來自台灣時。", "en": "When you mean that you are from Taiwan."}}]}, "ja:kp:noun-desu": {"kind": "grammar", "exampleRefs": ["ja:l01-1:s02", "ja:l01-1:s03", "ja:x:l01-1-02", "ja:x:l01-1-03"], "title": {"zh-Hant": "我是…：〔名字〕です", "en": "I am …: 〔name〕です"}, "pattern": {"zh-Hant": "〔名字〕です。", "en": "〔name〕です。"}, "meaning": {"zh-Hant": "向對方說出自己的名字。", "en": "Tells someone your name."}, "points": {"zh-Hant": ["日語自我介紹時通常不說「我」，直接「名字＋です」就可以。", "說自己的名字不能加 さん；さん 只能接在別人的名字後面。", "です 唸起來接近 des，結尾的 u 幾乎聽不到。"], "en": ["Japanese usually leaves out “I”; just say your name + です.", "Never add さん to your own name; さん is only used after other people’s names.", "です sounds close to “des”; the final u is barely heard."]}, "pitfalls": [{"wrong": "リンさんです。", "right": "リンです。", "why": {"zh-Hant": "自我介紹報自己名字時不能加 さん；さん 是尊稱，只接在別人名字後。", "en": "When introducing yourself, never add さん to your own name; さん is an honorific used only after other people’s names."}, "context": {"zh-Hant": "自我介紹，說出自己的名字時。", "en": "When introducing yourself by your own name."}}], "later": [{"form": "学生です。", "text": {"zh-Hant": "用「〔身分〕です」說自己的身分或職業，下一節會學。", "en": "Using 〔role / occupation〕です to state your role or occupation comes in the next section."}}]}, "ja:kp:particle-reading": {"kind": "pronunciation", "exampleRefs": ["ja:l01-3:s01", "ja:l01-3:s04", "ja:x:l01-3-01", "ja:x:l01-3-02"], "title": {"zh-Hant": "助詞 は、へ 的讀音", "en": "Reading the particles は and へ"}, "pattern": {"zh-Hant": "は → wa　へ → e（只在當助詞時）", "en": "は → wa　へ → e (only as particles)"}, "meaning": {"zh-Hant": "這兩個假名當助詞時，唸法和平常不同。", "en": "These two kana are pronounced differently when they are particles."}, "points": {"zh-Hant": ["「レンさんは？」當中的「は」是話題助詞，讀作 wa。", "「読書会へ」當中的「へ」是方向助詞，讀作 e。", "不是助詞時就照平常的發音唸，例如「はじめまして」的「は」依然維持一般假名發音（不唸 wa）。日常問候語「こんにちは」「こんばんは」尾端的「は」源自話題助詞，因此同樣讀作 wa。"], "en": ["The particle は in レンさんは？ is pronounced wa.", "The particle へ in 読書会へ is pronounced e.", "When they are not particles, they keep their standard sounds: the は in はじめまして keeps its normal sound (not wa). Everyday greetings like こんにちは and こんばんは end with a は that originated as a topic particle, so they are also pronounced wa."]}}, "ja:kp:topic-return": {"kind": "grammar", "exampleRefs": ["ja:l01-2:s01", "ja:l01-2:s03", "ja:l01-2:s02", "ja:x:l01-2-01", "ja:x:l01-2-02"], "title": {"zh-Hant": "說身分，再問「你呢？」", "en": "State your role, then ask “And you?”"}, "pattern": {"zh-Hant": "〔身分／職業〕です。〔對方名字〕さんは？", "en": "〔role / occupation〕です。〔their name〕さんは？"}, "meaning": {"zh-Hant": "先說自己的身分或職業，再問對方「你呢？」；說完來自哪裡也可以用後半句反問。", "en": "State your role or occupation, then ask “And you?” The short question also works after saying where you are from."}, "points": {"zh-Hant": ["這個 は 唸 wa。", "日語很少直接說「你」，通常用「對方名字＋さん」。", "說身分或職業時，用「〔身分／職業〕です」，例如「学生です」（我是學生）或「会社員です」（我是上班族）。接著說「〔名字〕さんは？」就是問對方的身分或職業；若上一句說來處，就是問來處。"], "en": ["This は is read wa.", "Japanese rarely says “you” directly; use the person’s name + さん.", "To state your occupation or role, use 〔occupation / role〕です: 学生です means “I’m a student”; 会社員です means “I’m an office worker”. Then 〔name〕さんは？ asks about theirs. After saying where you are from, the same question asks about their origin."]}}, "ja:kp:yoroshiku": {"kind": "expression", "exampleRefs": ["ja:l01-1:s04", "ja:l01-1:s05", "ja:x:l01-1-04", "ja:x:l01-1-06"], "title": {"zh-Hant": "結尾：よろしくお願いします", "en": "Closing: よろしくお願いします"}, "pattern": {"zh-Hant": "よろしくお願いします。 → こちらこそ、よろしくお願いします。", "en": "よろしくお願いします。 → こちらこそ、よろしくお願いします。"}, "meaning": {"zh-Hant": "自我介紹的固定結尾，意思接近「請多指教」。", "en": "The set closing of a self-introduction, roughly “I look forward to working with you.”"}, "points": {"zh-Hant": ["對方先說了，你就回「こちらこそ、よろしくお願いします」（我才要請你多指教）。", "不只用在初次見面：請人幫忙、開始一起做事時也常說。"], "en": ["If the other person says it first, reply こちらこそ、よろしくお願いします (likewise).", "Not only for first meetings: also used when asking for help or starting to work together."]}, "pitfalls": [{"wrong": "こちらこそ。", "right": "よろしくお願いします。", "why": {"zh-Hant": "自己先開口結尾要說「よろしくお願いします」；「こちらこそ」是回應對方的請託，只有在對方先說之後才能使用（如「こちらこそ、よろしくお願いします」）。", "en": "When speaking first, close with よろしくお願いします; こちらこそ is a reply used only after the other person speaks first (e.g., こちらこそ、よろしくお願いします)."}, "context": {"zh-Hant": "初次見面，自己先說自我介紹的結語，對方還沒說「よろしくお願いします」時。", "en": "When closing your introduction at a first meeting, before the other person has said よろしくお願いします."}}]}}, "sentences": {"ja:l01-1:s01": {"tokens": [{"t": "はじめまして", "s": "ja:はじめまして#1"}, {"t": "。"}], "tr": {"zh-Hant": "初次見面。", "en": "Nice to meet you."}}, "ja:l01-1:s02": {"tokens": [{"t": "レン", "s": "ja:name#1"}, {"t": "です", "s": "ja:です#1"}, {"t": "。"}], "tr": {"zh-Hant": "我是レン。", "en": "I’m Ren."}}, "ja:l01-1:s03": {"tokens": [{"t": "ミナ", "s": "ja:name#1"}, {"t": "です", "s": "ja:です#1"}, {"t": "。"}], "tr": {"zh-Hant": "我是ミナ。", "en": "I’m Mina."}}, "ja:l01-1:s04": {"tokens": [{"t": "よろしく", "s": "ja:よろしく#1"}, {"t": "お願いします", "r": "おねがいします", "s": "ja:お願いします#1"}, {"t": "。"}], "tr": {"zh-Hant": "請多指教。", "en": "I look forward to getting to know you."}, "spans": [{"from": 0, "to": 1, "kp": "ja:kp:yoroshiku"}]}, "ja:l01-1:s05": {"tokens": [{"t": "こちらこそ", "s": "ja:こちらこそ#1"}, {"t": "、"}, {"t": "よろしく", "s": "ja:よろしく#1"}, {"t": "お願いします", "r": "おねがいします", "s": "ja:お願いします#1"}, {"t": "。"}], "tr": {"zh-Hant": "我才要請你多指教。", "en": "Likewise, I look forward to it."}, "spans": [{"from": 0, "to": 3, "kp": "ja:kp:yoroshiku"}]}, "ja:l01-2:s01": {"tokens": [{"t": "学生", "r": "がくせい", "s": "ja:学生#1"}, {"t": "です", "s": "ja:です#1"}, {"t": "。"}], "tr": {"zh-Hant": "我是學生。", "en": "I’m a student."}}, "ja:l01-2:s02": {"tokens": [{"t": "レン", "s": "ja:name#1"}, {"t": "さん", "s": "ja:さん#1"}, {"t": "は", "r": "わ", "s": "ja:は#topic"}, {"t": "？"}], "tr": {"zh-Hant": "レン你呢？", "en": "And you, Ren?"}, "spans": [{"from": 0, "to": 2, "kp": "ja:kp:topic-return"}]}, "ja:l01-2:s03": {"tokens": [{"t": "会社員", "r": "かいしゃいん", "s": "ja:会社員#1"}, {"t": "です", "s": "ja:です#1"}, {"t": "。"}], "tr": {"zh-Hant": "我是上班族。", "en": "I’m an office worker."}}, "ja:l01-2:s04": {"tokens": [{"t": "台湾", "r": "たいわん", "s": "ja:台湾#1"}, {"t": "から", "s": "ja:から#from"}, {"t": "来ました", "r": "きました", "s": "ja:来る#1"}, {"t": "。"}], "tr": {"zh-Hant": "我來自台灣。", "en": "I’m from Taiwan."}, "spans": [{"from": 1, "to": 2, "kp": "ja:kp:kara-kimashita"}]}, "ja:l01-2:s05": {"tokens": [{"t": "大阪", "r": "おおさか", "s": "ja:大阪#1"}, {"t": "から", "s": "ja:から#from"}, {"t": "来ました", "r": "きました", "s": "ja:来る#1"}, {"t": "。"}], "tr": {"zh-Hant": "我來自大阪。", "en": "I’m from Osaka."}, "spans": [{"from": 1, "to": 2, "kp": "ja:kp:kara-kimashita"}]}, "ja:l01-3:s01": {"tokens": [{"t": "読書会", "r": "どくしょかい", "s": "ja:読書会#1"}, {"t": "へ", "r": "え", "s": "ja:へ#1"}, {"t": "ようこそ", "s": "ja:ようこそ#1"}, {"t": "。"}], "tr": {"zh-Hant": "歡迎來到讀書會。", "en": "Welcome to the book club."}, "spans": [{"from": 0, "to": 1, "kp": "ja:kp:particle-reading"}]}, "ja:l01-3:s02": {"tokens": [{"t": "こんにちは", "r": "こんにちわ", "s     const words = indices.map(i => it.tiles[i]);
    if (it.answers.some(a => a.length === words.length && a.every((w,k) => w === words[k]))) return {ok:true};
    const bad = words.find(w => !it.answers.some(a => a.includes(w)));
    if (bad !== undefined) return {ok:false, reason:{kind:'tile',tile:bad}};
    return {ok:false, reason:{kind:it.answers.some(a => words.length < a.length) ? 'missing' : 'order'}};
  }
  const lines = indices.map(i => it.lines[i]), R = it.rules;
  const ok = lines.length === it.lines.length && lines[0] === R.first && lines.at(-1) === R.last && (R.before || []).every(([a,b]) => lines.indexOf(a) < lines.indexOf(b));
  return ok ? {ok:true} : {ok:false, reason:{kind:lines.length < it.lines.length ? 'missing' : 'lines'}};
}
function builtFeedback(it, result){
  // Old saved strings are ignored; reconstruct their reason in the current locale.
  const reason = result.feedbackReason || gradeBuilt(it,result).reason;
  if (reason?.kind === 'tile') return L(it.tileFeedback[reason.tile]);
  if (reason?.kind === 'missing') return t('missingParts');
  if (reason?.kind === 'lines') return L(it.fb);
  return t('wordOrder');
}
function runChecks(it, text){
  const v = text.trim(), out = {};
  for (const c of it.checks || []){
    out[c.id] = c.type === 'startsWith' ? v.startsWith(c.value) : c.type === 'contains' ? v.includes(c.value)
      : c.type === 'containsAny' ? c.value.some(x => v.includes(x))
      : c.type === 'endsWithAny' ? c.value.some(x => v.endsWith(x)) : c.type === 'notMatches' ? !new RegExp(c.value).test(v) : false;
  }
  return out;
}

// ---------- review (simple SM-2 style intervals) ----------
function reviewCards(){
  return Object.entries(S.deck).filter(([k]) => {
    if (k.startsWith('s:')) return Object.hasOwn(PKG.sentences,k.slice(2));
    if (k.startsWith('w:')) { const hit = sense(k.slice(2)); return !!hit?.sense; }
    return false;
  }).map(([k, v]) => ({...v, k}));
}
function renderReview(){
  const now = Date.now(), cards = reviewCards(), due = cards.filter(c => (c.due || 0) <= now);
  if (!cards.length) return `<h1>${t('review')}</h1><p class="muted">${t('empty')}</p>`;
  if (!due.length) return `<h1>${t('review')}</h1><p>${t('noneDue')}</p><p class="muted">${cards.length}</p>`;
  const c = due[0], flipped = S.flip === c.k;
  let front = '', back = '';
  if (c.k.startsWith('s:')){ const sid = c.k.slice(2); front = `<div class="ja" lang="ja">${esc(textOf(sid))}</div>`; back = `<div>${esc(L(PKG.sentences[sid].tr))}</div>`; }
  else { const ref = c.k.slice(2), hit = sense(ref), form = wordForm(ref); front = `<div class="ja" lang="ja" style="font-size:2rem">${esc(form.surface)}</div>`; back = `${form.reading ? `<div lang="ja">${esc(form.reading)}</div>` : ''}${form.surface !== form.lemma ? `<div class="muted">${t('lemma')}：<span lang="ja">${esc(form.lemma)}</span></div>` : ''}<div style="font-size:1.2rem">${esc(wordL(hit.sense.gloss))}</div>`; }
  const speechText = c.k.startsWith('s:') ? sayOf(c.k.slice(2)) : wordForm(c.k.slice(2)).reading;
  const reviewAudio = speechText ? `<button class="icon" data-say="${esc(speechText)}" aria-label="${t('play')}">▶</button>` : '';
  return `<h1>${t('review')}</h1><p class="muted">${t('due')}：${due.length}</p><div class="card flash">${front}${flipped ? '<hr>' + back : ''}
    <div class="row" style="justify-content:center">${flipped
      ? `<button class="ghost" data-grade="0">${t('againBtn')}</button><button class="primary" data-grade="1">${t('good')}</button><button class="ghost" data-grade="2">${t('easy')}</button>`
      : `<button class="primary" data-flip="${c.k}">${t('flip')}</button>${reviewAudio}`}</div></div>`;
}
function gradeCard(g){
  const c = S.deck[S.flip]; if (!c) return;
  c.ease = Math.max(1.3, (c.ease || 2.5) + [-.2, 0, .15][g]);
  c.ivl = g === 0 ? 0 : Math.max(1, Math.round((c.ivl || 0) === 0 ? (g === 2 ? 3 : 1) : c.ivl * c.ease));
  c.due = Date.now() + (g === 0 ? 10 * 60e3 : c.ivl * 864e5);
  S.flip = null;
}

function produceRetentionText(){
  if(memoryOnly || storageFailure || storageConflict) return S.loc === 'en' ? 'This tab is not saving typed text. Earlier saved copies may remain.' : '本頁目前不會儲存輸入文字；先前儲存的副本可能仍在。';
  if(!PKG.preview) return S.loc === 'en' ? 'Typed text is saved in this browser. This lesson has no in-page clearing control. Manage saved data in your browser settings.' : '輸入的文字會儲存在此瀏覽器。此課頁沒有清除資料按鈕，請使用瀏覽器設定管理已儲存的資料。';
  return S.loc === 'en' ? 'Typed text is saved in this browser and may remain in history copies. Avoid personal details you do not want to keep.' : '輸入的文字會儲存在此瀏覽器，也可能保留在歷史副本中。請避免輸入不想保留的個人資料。';
}
function storageActions(){
  return storageFailure || storageConflict || memoryOnly ? `<button class="ghost" data-memory-round>${t('freshMemory')}</button>` : '';
}
function privacyControls(){
  if (!PKG.preview) return '';
  const explanation = S.loc === 'en'
    ? 'This browser saves progress, typed answers (which may contain personal information), and earlier history copies. Start over only resets the current practice round; it does not erase archived copies. You can explicitly clear this section’s preview data below. Other lessons and the existing app are not affected. Before clearing, close other pages for this lesson, especially older versions. A non-personal marker helps stop tabs running this version from restoring cleared data, but simultaneous writes cannot be fully prevented; already-open older versions do not recognize it.'
    : '此瀏覽器會儲存進度、你輸入的文字（可能包含個人資料），以及歷史副本。「全部重新開始」只重設本輪，不會刪掉歷史副本。你可以在下方明確清除此節試用版資料；不影響其他課或既有網站資料。清除前請先關閉此課的其他頁面，尤其是舊版本。清除後的不含個人內容標記有助阻止使用此版本的其他分頁寫回，但無法完全防止同時寫入；已開啟的舊版本不認得此標記。';
  return `<details class="note" id="saved-data"><summary>${t('savedData')}</summary><p>${explanation}</p><button class="ghost" data-clear-progress>${t('clearSaved')}</button></details>`;
}
function clearThisSection(){
  if (!PKG.preview) return;
  clearReadError = false;
  let keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k === KEY || k?.startsWith(KEY + ':history:') || k?.startsWith(KEY + ':conflict:')) keys.push(k);
    }
  } catch {
    // Enumeration failure does not imply the already-read current record or
    // normal get/set path is unsafe. No confirmation or write has occurred.
    clearReadError = true; updateStorageNotice();
    document.getElementById('storage-status').focus?.(); return;
  }
  const question = S.loc === 'en'
    ? 'Clear this section’s saved progress, typed answers and archived copies in this browser? This cannot be undone. First close other pages for this lesson, especially older versions. Other lessons and the existing app are not affected.'
    : '確定清除此瀏覽器中這一節的進度、輸入文字及歷史副本？此操作無法復原。請先關閉此課的其他頁面，尤其是舊版本。不影響其他課或既有網站資料。';
  if (typeof window.confirm !== 'function' || !window.confirm(question)) { updateStorageNotice(); return; }
  try {
    // Best-effort tombstone for this version; check/write is not atomic.
    // After explicit confirmation, free scoped storage before marker creation.
    const priorEpoch = Number(localStorage.getItem(CLEAR_KEY));
    const epoch = Number.isSafeInteger(priorEpoch) && priorEpoch >= 0 && priorEpoch < Number.MAX_SAFE_INTEGER ? String(priorEpoch + 1) : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    // Re-enumerate after confirmation so copies written while the dialog
    // was open are within the same explicitly approved section scope.
    keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k === KEY || k?.startsWith(KEY + ':history:') || k?.startsWith(KEY + ':conflict:')) keys.push(k);
    }
    for (const k of keys) localStorage.removeItem(k);
    clearGuardFailed = false;
    try { localStorage.setItem(CLEAR_KEY, epoch); clearEpochAtLoad = epoch; }
    catch { clearGuardFailed = true; }
    lastSavedRaw = null;
    const loc = S.loc; closePop();
    for (const k of Object.keys(store)) delete store[k];
    for (const k of Object.keys(S)) delete S[k];
    Object.assign(S,{loc,tab:'practice',showAll:false,shown:{},deck:{},prac:{i:-1,res:{},queue:null},practiceHistory:[],practiceRevisions:{}});
    storageFailure = false; storageConflict = false; storageClearedExternally = false;
    clearCompleted = true; clearError = false; memoryOnly = true;
  } catch { clearError = true; memoryOnly = true; }
  return render('#storage-status');
}
const controlSelector = (name,value) => '[' + name + '=' + JSON.stringify(String(value)) + ']';
function restoreControl(selector,index = 0){
  const controls = document.querySelectorAll(selector), target = controls[index >= 0 ? index : 0];
  (target || document.getElementById('main')).focus?.();
}
function renderForControl(button,selector){
  const index = [...document.querySelectorAll(selector)].indexOf(button);
  render(); restoreControl(selector,index);
}

// ---------- shell ----------
const TABS = ['content', 'teaching', 'practice', 'review'];
function render(focusSelector){
  document.documentElement.lang = S.loc === 'en' ? 'en' : 'zh-Hant';
  document.getElementById('loc').value = S.loc;
  document.getElementById('loc-label').textContent = t('loc');
  document.getElementById('tabs').innerHTML = TABS.map(k => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${t(k)}${k === 'review' && Object.keys(S.deck).length ? ' · ' + Object.keys(S.deck).length : ''}</button>`).join('');
  const missingCards = Object.keys(S.deck).length - reviewCards().length;
  const page = {content:renderContent, teaching:renderTeaching, practice:renderPractice, review:renderReview}[S.tab]();
  const notice = PKG.preview ? `<div class="card" role="note">${S.loc === 'en' ? 'Lesson preview. Content is still being checked and is not final.' : '教材草稿試用版，內容仍在確認中，尚未定稿。'}</div>` : '';
  document.getElementById('main').innerHTML = notice + `<p id="storage-status" role="status" tabindex="-1"></p><div id="storage-actions">${storageActions()}</div>` + (S.tab === 'review' && missingCards ? `<p role="note">${S.loc === 'en' ? 'Some saved cards are unavailable in this draft. Their records are kept.' : '部分已儲存卡片不在此草稿中，原紀錄仍保留。'}</p>` : '') + page + `<p class="note">${t('demoNote')}</p>` + privacyControls();
  save();
  updateStorageNotice();
  if (focusSelector) { const target = document.getElementById('main').querySelector?.(focusSelector) || document.querySelector?.(focusSelector); (target || document.getElementById('main')).focus?.(); }
}
function updateStorageNotice(){
  let message = '';
  if (clearReadError) message = S.loc === 'en' ? 'Saved data could not be listed. Nothing was cleared and no confirmation was requested. This clear request did not change your saving mode.' : '無法列出已儲存的資料。尚未要求確認，也沒有清除任何資料。這次清除請求沒有改變儲存模式。';
  else if (clearError) message = S.loc === 'en' ? 'Clearing did not finish; some saved copies may remain. No new cross-tab marker was established, so other tabs may save old data again. Close other lesson pages now. This tab will not save new changes.' : '清除尚未完成，部分副本可能仍在瀏覽器中。未建立新的跨分頁標記，其他分頁可能再次儲存舊資料。請現在關閉其他課頁；本頁不會儲存新變更。';
  else if (clearCompleted && clearGuardFailed) message = S.loc === 'en' ? 'This section’s saved copies were removed, but the cross-tab marker could not be written. Other tabs are not protected and may save old data again. Close other lesson pages now. This tab will not save new changes.' : '此節已儲存的副本已移除，但無法寫入跨分頁標記。其他分頁沒有此保護，可能再次儲存舊資料。請現在關閉其他課頁；本頁不會儲存新變更。';
  else if (storageClearedExternally) message = S.loc === 'en' ? 'A clear operation was requested in another tab. This tab will not restore older data or save new changes. Copy any text you still need before closing.' : '另一分頁已要求清除儲存資料。本頁不會把它寫回，也不會儲存新變更；關閉前請先自行複製仍需要的文字。';
  else if (clearCompleted) message = S.loc === 'en' ? 'This section’s progress, typed answers and archived copies were cleared. A non-personal marker helps stop tabs running this version from restoring them, but simultaneous writes cannot be fully prevented. Close any older lesson pages that are still open now; they do not recognize the marker and may save old data again. Continue without saving, or reload to save new progress.' : '此節進度、輸入文字及歷史副本已清除，只留下有助阻止使用此版本的其他分頁寫回的不含個人內容標記，但無法完全防止同時寫入。請現在關閉仍開著的舊版本課頁；它們不認得此標記，可能再次儲存舊資料。可繼續不儲存的練習，或重新整理後儲存新進度。';
  else if (storageConflict) message = S.loc === 'en' ? 'Another tab saved newer progress. Your work in this tab stays in memory only; no new backup is written. Copy any text you need before closing or reloading. Earlier saved copies are kept until you explicitly clear them.' : '另一分頁已儲存較新的進度。本頁作答只留在記憶體，不會新增備份；關閉或重新整理前請自行複製需要的文字。既有副本會保留，直到你明確清除。';
  else if (memoryOnly) message = S.loc === 'en' ? 'Practice in this tab is not saved. The original stored data is unchanged; copy any text you need before closing.' : '本頁練習不會儲存，原有資料沒有改動；關閉前請自行複製需要的文字。';
  else if (storageFailure) message = S.loc === 'en' ? 'Saved progress cannot be used safely. The original data is kept. Start a fresh round in this tab without saving, or explicitly clear this section’s saved data.' : '儲存的進度無法安全使用，原資料仍保留。可在本頁開始不儲存的新一輪，或明確清除此節的儲存資料。';
  document.getElementById('storage-status').textContent = message;
  const retention = document.getElementById('prod-retention-copy');
  if(retention) retention.textContent = produceRetentionText();
  document.getElementById('storage-actions').innerHTML = storageActions();
}

function go(tab, anchor){
  S.tab = tab; closePop(); render(anchor ? undefined : controlSelector('data-tab',tab));
  if (anchor){ const el = document.getElementById(anchor); if (el){ el.scrollIntoView({block:'center'}); el.focus?.(); el.style.outline = '2px solid var(--brand)'; setTimeout(() => el.style.outline = '', 1600); } }
  else window.scrollTo(0, 0);
}
document.getElementById('loc').addEventListener('change', e => { S.loc = e.target.value; closePop(); render(); });
document.addEventListener('click', e => {
  const b = e.target.closest('button,.tok'); if (!b) { if (!e.target.closest('#pop')) closePop(); return; }
  const d = b.dataset, P = S.prac, order = P.queue || items.map(x => x.id), it = P.i >= 0 && itemById(order[P.i]), r = it ? (P.res[it.id] ||= {}) : null;
  if (b.classList.contains('tok')) return openPop(b);
  if (d.tab) return go(d.tab);
  if ('clearProgress' in d) return clearThisSection();
  if ('memoryRound' in d) { memoryOnly = true; storageFailure = false; S.tab = 'practice'; S.prac = {i:0,res:{},queue:null}; return render('.opt, [data-build], #prod'); }
  if ('memorySkip' in d) { memoryOnly = true; storageFailure = false; if (it) S.prac.res[it.id] = {skipped:true}; P.i = Math.min(P.i + 1, order.length); return render('.opt, [data-build], #prod, [data-prestart]'); }
  if ('close' in d) return closePop(true);
  if (d.play) return speak(sayOf(d.play));
  if (d.say) return speak(d.say);
  if (d.tr) { S.shown[d.tr] = !S.shown[d.tr]; return renderForControl(b,controlSelector('data-tr',d.tr)); }
  if ('all' in d) { S.showAll = !S.showAll; S.shown = {}; return render('[data-all]'); }
  if (d.save) {
    if (S.deck[d.save]) delete S.deck[d.save]; else S.deck[d.save] = {due:0};
    const opener = !document.getElementById('pop').hidden && document.querySelector('.tok.sel');
    // A sense may occur repeatedly in a sentence or dialogue. Saving changes
    // only the deck; preserve the exact token occurrence through this rerender.
    const occurrence = opener ? [...document.querySelectorAll('.tok')].indexOf(opener) : -1;
    const saveSelector = controlSelector('data-save',d.save), saveIndex = [...document.querySelectorAll(saveSelector)].indexOf(b);
    render();
    if (opener) {
      const again = opener.id ? document.getElementById(opener.id) : document.querySelectorAll('.tok')[occurrence];
      if (again && ['s','t','r'].every(k => again.dataset[k] === opener.dataset[k])) openPop(again);
      else closePop();
    } else restoreControl(saveSelector,saveIndex);
    return;
  }
  if (d.kp) { S.openKp = d.kp; return go('teaching', 'kp-' + d.kp); }
  if ('pstart' in d || 'prestart' in d) { S.prac = {i:0, res:{}, queue:null}; return render('.opt, [data-build], #prod'); }
  if ('pagain' in d) { const missed = order.filter(id => !P.res[id]?.ok); missed.forEach(id => delete P.res[id]); S.prac = {i:0, res:P.res, queue:missed}; return render('.opt, [data-build], #prod'); }
  if ('paudio' in d) return speak(it.audioRefs.map(sayOf).join(' '));
  if (d.pick && !r.done) { const o = it.options.find(x => x.id === d.pick); r.picked = o.id; if (o.correct) { r.done = true; r.ok = r.ok ?? true; } else { r.ok = false; } return render('.fb'); }
  if ('pretry' in d) { delete r.picked; return render('.opt'); }
  if (d.build) { (r.built ||= []).push(+d.build); delete r.lastOk; return render('[data-build], [data-pcheck]'); }
  if (d.unbuild) { const removed = r.built.splice(+d.unbuild, 1)[0]; delete r.lastOk; return render(`[data-build="${removed}"]`); }
  if ('preset' in d) { r.built = []; delete r.lastOk; return render('[data-build]'); }
  if ('pcheck' in d) {
    const g = gradeBuilt(it, r); r.lastOk = g.ok; r.feedbackReason = g.reason; delete r.feedback; if (g.ok) { r.done = true; r.ok = r.ok ?? true; } else { r.tries = (r.tries || 0) + 1; r.ok = false; if (r.tries >= 2) { r.showAnswer = true; r.done = true; } } return render('.fb');
  }
  if ('pshow' in d) { r.text = document.getElementById('prod').value; r.checks = runChecks(it, r.text); r.shown = true; return render('[data-pself]'); }
  if ('pself' in d) { r.ok = r.ok ?? d.pself === '1'; r.done = true; return render('[data-pnext]'); }
  if ('pnext' in d) { P.i++; window.scrollTo(0, 0); return render('.opt, [data-build], #prod, [data-prestart]'); }
  if (d.flip) { S.flip = d.flip; return render('[data-grade]'); }
  if (d.grade) { gradeCard(+d.grade); return render('[data-flip]'); }
});
document.addEventListener('input', e => { if (e.target.id === 'prod') { const P = S.prac, order = P.queue || items.map(x => x.id); (P.res[order[P.i]] ||= {}).text = e.target.value; save(); updateStorageNotice(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closePop(true);
  const token = e.target?.closest?.('.tok');
  // Native vocabulary buttons already synthesize click on Enter/Space.
  if (token && token.tagName !== 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); openPop(token);
  }
});
window.addEventListener?.('hashchange', () => closePop());
render();
</script>
</body>
